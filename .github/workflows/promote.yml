# Promote a released commit to the production Static Web App.
#
# Production does NOT reuse the bundle the dev workflow built. Vite inlines every VITE_* value at
# build time, so a bundle built under the `dev` environment would call the dev API, mint the test
# Stripe publishable key and carry dev's MSAL ids no matter what the `production` environment
# holds (docs/specs.md §20: "Front-ends bake their configuration in at build time"). This job
# therefore REBUILDS the released commit under `environment: production` and deploys that output.
#
# Triggered automatically when the dev workflow (azure-static-web-apps.yml) succeeds on `main` — a
# release is `dev` merged into `main` (spec §21-5a) — and also by a v* tag or a manual run. The
# commit is taken from the triggering run's head_sha, because a workflow_run job runs on the
# default branch's latest commit, not on the commit that was built.
#
# Usage:
#   merge dev -> main (automatic)
#   git tag v0.1.0 && git push origin v0.1.0
#   or Actions -> "Promote commit to production" -> Run workflow
#
# Fail-closed in three places, on purpose:
#   1. A secret named AZURE_STATIC_WEB_APPS_API_TOKEN_PROD must hold the PRODUCTION app's
#      deployment token (Static Web App -> Overview -> Manage deployment token). It deliberately
#      does NOT share a name with the dev token (AZURE_STATIC_WEB_APPS_API_TOKEN): GitHub falls
#      back to a repo-level secret of the same name when an environment has none, which would
#      deploy to DEV.
#   2. Every VITE_* this app reads must be set on the `production` environment. A variable that is
#      not passed to `npm run build` becomes `undefined` in the bundle silently, so this job
#      refuses to build rather than ship an unconfigured bundle.
#   3. The values that must differ from dev (the API host and the Stripe key) are checked for dev
#      shape, so a dev value restored by mistake cannot reach production.
#   Set the variables with: gh variable set <NAME> --env production -R <repo> --body <value>
# Until 1-3 pass, this workflow is EXPECTED TO FAIL at the guard steps.

name: Promote commit to production

on:
  # A release is `dev` merged into `main` (spec §21-5a). Once the dev workflow has built and tested
  # that main commit, this workflow ships a production build of the same commit — still behind the
  # `production` environment's required reviewer.
  workflow_run:
    workflows: ['Azure Static Web Apps CI/CD']
    types: [completed]
    branches: [main]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Dev workflow run ID that tested this commit (blank = newest successful dev run for the selected ref)'
        required: false
        type: string

permissions:
  contents: read
  actions: read # required to read the run that tested this commit

concurrency:
  group: promote-production
  cancel-in-progress: false # never cancel a production deployment half way

jobs:
  promote:
    name: Rebuild and deploy to production
    runs-on: ubuntu-latest
    # Only a successful dev run on main may start a workflow_run promotion; tag and manual runs pass.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    environment: production # required reviewer / approval rule lives here
    env:
      NODE_VERSION: '22'
      # workflow_run executes on the default branch's latest commit, so take the released commit from the event.
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Guard - production deployment token must exist
        env:
          PROD_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROD }}
        run: |
          if [ -z "$PROD_TOKEN" ]; then
            echo "::error title=Missing production secret::AZURE_STATIC_WEB_APPS_API_TOKEN_PROD is empty or not set. Add it as a secret on the 'production' environment (Settings -> Environments -> production) with the PRODUCTION Static Web App deployment token. Refusing to deploy: this is fail-closed by design so production never falls back to the dev token."
            exit 1
          fi

      - name: Guard - production build variables must be set and must not hold dev values
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SHOP_BASE_URL: ${{ vars.VITE_SHOP_BASE_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_MSAL_CLIENT_ID: ${{ vars.VITE_MSAL_CLIENT_ID }}
          VITE_MSAL_TENANT_ID: ${{ vars.VITE_MSAL_TENANT_ID }}
          VITE_MSAL_TENANT_NAME: ${{ vars.VITE_MSAL_TENANT_NAME }}
          VITE_MSAL_API_SCOPE: ${{ vars.VITE_MSAL_API_SCOPE }}
        run: |
          set -euo pipefail
          missing=""
          for name in VITE_API_BASE_URL VITE_SHOP_BASE_URL VITE_STRIPE_PUBLISHABLE_KEY \
                      VITE_MSAL_CLIENT_ID VITE_MSAL_TENANT_ID VITE_MSAL_TENANT_NAME VITE_MSAL_API_SCOPE; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing production variables::Not set on the 'production' environment:$missing. Set each one with: gh variable set <NAME> --env production -R <repo> --body <value>. Refusing to build: a VITE_* that is not passed to the build becomes undefined in the bundle, silently."
            exit 1
          fi
          case "$VITE_API_BASE_URL" in
            https://*) ;;
            *) echo "::error title=Bad production variable::VITE_API_BASE_URL must be an https:// URL."; exit 1 ;;
          esac
          case "$VITE_API_BASE_URL" in
            *-dev*) echo "::error title=Dev value on production::VITE_API_BASE_URL still points at the dev host."; exit 1 ;;
          esac
          case "$VITE_SHOP_BASE_URL" in
            https://*) ;;
            *) echo "::error title=Bad production variable::VITE_SHOP_BASE_URL must be an https:// URL."; exit 1 ;;
          esac
          case "$VITE_STRIPE_PUBLISHABLE_KEY" in
            pk_live_*) ;;
            *) echo "::error title=Test Stripe key on production::VITE_STRIPE_PUBLISHABLE_KEY must be the live publishable key (pk_live_...)."; exit 1 ;;
          esac
          echo "All required production variables are set and none holds a dev value."

      - name: Verify the released commit passed the dev workflow
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RUN_ID="${{ inputs.run_id }}"
          if [ -z "$RUN_ID" ] && [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
          fi
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list \
              --workflow azure-static-web-apps.yml \
              --commit "$RELEASE_SHA" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No successful dev run found for $RELEASE_SHA. Deploy this commit to dev first, or pass run_id explicitly."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Released commit $RELEASE_SHA (tested by dev run $RUN_ID) - rebuilding it for production."

      - name: Check out the released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build under the production variables
        env:
          # Every VITE_* the app reads must be mapped here from the production environment, or it
          # is silently undefined in the bundle.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SHOP_BASE_URL: ${{ vars.VITE_SHOP_BASE_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_MSAL_CLIENT_ID: ${{ vars.VITE_MSAL_CLIENT_ID }}
          VITE_MSAL_TENANT_ID: ${{ vars.VITE_MSAL_TENANT_ID }}
          VITE_MSAL_TENANT_NAME: ${{ vars.VITE_MSAL_TENANT_NAME }}
          VITE_MSAL_API_SCOPE: ${{ vars.VITE_MSAL_API_SCOPE }}
        run: npm run build

      - name: Copy staticwebapp.config.json into the build output
        run: cp staticwebapp.config.json dist/staticwebapp.config.json

      - name: Sanity check the build output
        run: |
          test -f dist/index.html
          test -f dist/staticwebapp.config.json

      - name: Deploy to production
        env:
          # swa deploy reads the token from this variable when --deployment-token is absent
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROD }}
        run: npx --yes @azure/static-web-apps-cli@2 deploy ./dist --env production
